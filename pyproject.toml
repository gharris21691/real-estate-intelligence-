[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-intelligence"
version = "0.1.0"
description = "Privacy-safe foundation for an approved California parcel-data pilot"
requires-python = ">=3.11"

[project.scripts]
rei = "rei.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
rei = ["migrations/*.sql"]
